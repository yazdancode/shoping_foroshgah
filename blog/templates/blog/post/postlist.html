{% extends 'parent/base.html' %}

{% block title %} List of Posts {% endblock %}

{% block content %}
    <h1>List of Posts</h1>
    {% for post in posts %}
        <a href="{{ post.get_absolute_url }}">
            <h2>{{ post.title }} : {{ post.author }}</h2>
        </a>
    {% endfor %}
{% endblock %}
