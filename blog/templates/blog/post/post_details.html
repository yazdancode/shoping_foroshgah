{% extends 'parent/base.html' %}

{% block title %} {{ post.title }} {% endblock %}

{% block content %}
    <div class="container">
        <div class="post-card">
            <h2 class="post-title"> {{ post.title }} </h2>
            <p class="post-author">✍️ نویسنده: {{ post.author }} </p>
            <p class="post-body"> {{ post.body }} </p>
            <p class="published-date">
                🗓 تاریخ انتشار:
                <span id="published-date" title="Gregorian Date: {{ post.publish|date:'Y-m-d H:i' }}">
                    {{ post.jalali_publish }}
                </span>
            </p>
        </div>
    </div>
{% endblock %}
