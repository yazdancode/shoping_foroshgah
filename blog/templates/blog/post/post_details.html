{% extends 'parent/base.html' %}

{% block title %} {{ post.title }} {% endblock %}

{% block content %}
    <div class="container">
        <h2> {{ post.title }} : {{ post.author }} </h2>
        <p> {{ post.body }} </p>
        <p class="published-date">Published <span id="published-date">{{ post.published|date:"Y-m-d H:i" }}</span></p>
    </div>
{% endblock %}
