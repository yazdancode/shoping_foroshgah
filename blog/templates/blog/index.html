{% extends 'parent/base.html' %}

{% block title %}صفحه اصلی{% endblock %}

{% block content %}
    <div class="container">
        <h1>به وب‌سایت ما خوش آمدید!</h1>
        <p>برای ورود به حساب کاربری خود، روی دکمه زیر کلیک کنید:</p>
        <a href="{% url 'postlist' %}" class="login-btn">ورود به سایت</a>
    </div>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            direction: rtl;
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        .login-btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 10px;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: 0.3s;
        }
        .login-btn:hover {
            background-color: #0056b3;
        }
    </style>
{% endblock %}
