<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز عبور</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            direction: rtl;
            text-align: right;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تغییر رمز عبور</h2>

    <form id="passwordForm" method="post">
        {% csrf_token %}

        <label for="old_password">رمز عبور فعلی:</label>
        <input type="password" id="old_password" name="old_password" required>
        <div class="error" id="oldPasswordError"></div>

        <label for="new_password1">رمز عبور جدید:</label>
        <input type="password" id="new_password1" name="new_password1" required>
        <div class="error" id="newPasswordError"></div>

        <label for="new_password2">تکرار رمز عبور جدید:</label>
        <input type="password" id="new_password2" name="new_password2" required>
        <div class="error" id="confirmPasswordError"></div>

        <button type="submit">تغییر رمز عبور</button>
    </form>

    <a class="back-link" href="{% url 'index' %}">بازگشت به صفحه اصلی</a>
</div>

<script>
    document.getElementById("passwordForm").addEventListener("submit", function(event) {
        let valid = true;

        // دریافت مقدار فیلدها
        let oldPassword = document.getElementById("old_password").value.trim();
        let newPassword1 = document.getElementById("new_password1").value.trim();
        let newPassword2 = document.getElementById("new_password2").value.trim();

        // انتخاب عناصر خطا
        let oldPasswordError = document.getElementById("oldPasswordError");
        let newPasswordError = document.getElementById("newPasswordError");
        let confirmPasswordError = document.getElementById("confirmPasswordError");

        // پاک کردن پیام‌های خطای قبلی
        oldPasswordError.textContent = "";
        newPasswordError.textContent = "";
        confirmPasswordError.textContent = "";

        // بررسی رمز عبور فعلی
        if (oldPassword.length < 6) {
            oldPasswordError.textContent = "رمز عبور فعلی حداقل باید ۶ کاراکتر باشد.";
            valid = false;
        }

        // بررسی رمز عبور جدید
        if (newPassword1.length < 8) {
            newPasswordError.textContent = "رمز عبور جدید باید حداقل ۸ کاراکتر باشد.";
            valid = false;
        }

        // بررسی پیچیدگی رمز عبور جدید
        let passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        if (!passwordRegex.test(newPassword1)) {
            newPasswordError.textContent = "رمز عبور باید شامل حروف بزرگ، کوچک، عدد و یک نماد خاص باشد.";
            valid = false;
        }

        // بررسی مطابقت رمزهای عبور جدید
        if (newPassword1 !== newPassword2) {
            confirmPasswordError.textContent = "رمز عبور جدید با تکرار آن مطابقت ندارد!";
            valid = false;
        }

        if (!valid) {
            event.preventDefault(); // جلوگیری از ارسال فرم در صورت خطا
        }
    });
</script>

</body>
</html>
